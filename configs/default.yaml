# Moises-Light Configuration (Enc-Dec V3)

audio:
  sample_rate: 44100
  n_fft: 6144
  hop_length: 1024
  win_length: 6144
  duration: 4.0  # Reduced from 9.0 to save VRAM

model:
  name: "moises_light"
  num_layers: 3   # Encoder layers
  num_dec_layers: 1 # Decoder layers (Asymmetric UNet)
  num_bands: 4   # N_band: Efficient equal subband splitting
  G: 8          # Growth factor for hierarchical channels(num_bands * G)
  n_rope: 4      # Number of RoPE/RNN blocks in bottleneck
  num_heads: 8   # Number of attention heads
  dropout: 0.1
  bottleneck_type: "attention"  # 'rnn' or 'attention'

training:
  batch_size: 2  
  samples_per_track: 10 # Strategy 1: Virtual Dataset Expansion
  lr: 0.0003   
  epochs: 200
  val_overlap: 0.25
  optimizer: "adamw"
  scheduler: "cosine"
